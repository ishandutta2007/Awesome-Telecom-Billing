<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="cyanPurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#9b51e0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatAnim {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes rotateRing {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .pulse-circle-1 {
        transform-origin: 1050px 140px;
        animation: pulseSlow 4s ease-in-out infinite;
      }
      .pulse-circle-2 {
        transform-origin: 150px 260px;
        animation: pulseSlow 6s ease-in-out infinite 1s;
      }
      .floating-tag {
        animation: floatAnim 4.5s ease-in-out infinite;
      }
      .floating-tag-delayed {
        animation: floatAnim 5s ease-in-out infinite 1.5s;
      }
      .data-stream {
        stroke-dasharray: 6, 8;
        animation: dashMove 8s linear infinite;
      }
      .rotating-gear {
        transform-origin: 1050px 190px;
        animation: rotateRing 20s linear infinite;
      }
    </style>
  </defs>

  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <circle cx="150" cy="260" r="180" fill="#00F2FE" opacity="0.12" filter="url(#glowCyan)" class="pulse-circle-2" />
  <circle cx="1050" cy="140" r="220" fill="#7F00FF" opacity="0.15" filter="url(#glowPurple)" class="pulse-circle-1" />
  <circle cx="600" cy="40" r="120" fill="#4FACFE" opacity="0.08" filter="url(#glowCyan)" />

  <g opacity="0.18" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" stroke-dasharray="4, 4"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke-dasharray="4, 4"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke-dasharray="4, 4"/>
    <line x1="200" y1="0" x2="200" y2="380" stroke-dasharray="4, 4"/>
    <line x1="600" y1="0" x2="600" y2="380" stroke-dasharray="4, 4"/>
    <line x1="1000" y1="0" x2="1000" y2="380" stroke-dasharray="4, 4"/>
  </g>

  <path d="M 80,190 Q 250,90 420,170 T 780,180 T 1120,120" fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="2" class="data-stream" opacity="0.7"/>
  <path d="M 120,290 Q 380,240 600,310 T 950,220 T 1150,280" fill="none" stroke="#00F2FE" stroke-width="1.5" class="data-stream" opacity="0.4"/>

  <g class="floating-tag">
    <circle cx="1050" cy="190" r="95" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="12, 10" opacity="0.4" class="rotating-gear"/>
    <circle cx="1050" cy="190" r="75" fill="none" stroke="url(#cyanPurpleGrad)" stroke-width="2.5" opacity="0.8" />
    <circle cx="1050" cy="190" r="55" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />

    <path d="M 1050,152 L 1050,228 M 1030,228 L 1070,228 M 1038,180 L 1062,180 M 1042,205 L 1058,205" stroke="#00F2FE" stroke-width="3" stroke-linecap="round" />
    <circle cx="1050" cy="150" r="5" fill="#FFD700" filter="url(#glowGold)"/>

    <path d="M 1022,142 A 38 38 0 0 1 1078,142" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    <path d="M 1010,130 A 55 55 0 0 1 1090,130" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <path d="M 998,118 A 72 72 0 0 1 1102,118" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
  </g>

  <g class="floating-tag-delayed">
    <rect x="80" y="52" width="150" height="34" rx="17" fill="url(#cardGrad)" stroke="#00F2FE" stroke-width="1" />
    <circle cx="98" cy="69" r="5" fill="#00F2FE" filter="url(#glowCyan)" />
    <text x="112" y="74" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">&#x26A1; REAL-TIME OCS</text>
  </g>

  <g class="floating-tag">
    <rect x="245" y="52" width="165" height="34" rx="17" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" />
    <circle cx="263" cy="69" r="5" fill="#a855f7" filter="url(#glowPurple)" />
    <text x="277" y="74" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">&#x1F4E1; 5G MONETIZATION</text>
  </g>

  <g transform="translate(80, 155)">
    <text x="0" y="0" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2.5">
      CURATED ECOSYSTEM &amp; ARCHITECTURE GUIDE
    </text>

    <text x="0" y="46" fill="url(#cyanPurpleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Telecom Billing
    </text>

    <text x="0" y="82" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      Convergent Billing &#x2022; Real-Time Charging (OCS) &#x2022; Rating &#x2022; CDR Mediation &#x2022; BSS for CSPs, MVNOs &amp; ISPs
    </text>
  </g>

  <g transform="translate(80, 290)">
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="4" fill="#00F2FE"/>
      <text x="32" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Enterprise SaaS</text>
    </g>

    <g transform="translate(195, 0)">
      <rect width="195" height="42" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="4" fill="#A855F7"/>
      <text x="32" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Open-Source OCS/BSS</text>
    </g>

    <g transform="translate(405, 0)">
      <rect width="200" height="42" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="4" fill="#FFD700"/>
      <text x="32" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">3GPP &amp; TM Forum APIs</text>
    </g>

    <g transform="translate(620, 0)">
      <rect width="190" height="42" rx="8" fill="rgba(15, 23, 42, 0.75)" stroke="#334155" stroke-width="1.2"/>
      <circle cx="20" cy="21" r="4" fill="#10B981"/>
      <text x="32" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">CDR Mediation &amp; Rating</text>
    </g>
  </g>
</svg>